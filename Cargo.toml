[package]
name = "textdistance-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.9"
itertools = "0.15.0"
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xz2 = "0.1.7"

[dev-dependencies]
serde_json = "1"
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false